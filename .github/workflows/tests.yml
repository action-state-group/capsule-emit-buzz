# SPDX-License-Identifier: Apache-2.0
# Test workflow. Runs on `pull_request` (NOT pull_request_target) so it
# correctly receives NO secrets while executing PR code — the neutrality gate
# lives in a separate workflow for exactly this reason.
#
# One job, `check`, runs scripts/check.sh: the same command run locally before
# every push (AGENTS.md), so CI and the local check cannot drift. It covers:
#   - the Python reference implementation and its tests, including the
#     distinct-id / same-semantic-digest test and the round-trip test;
#   - the Go second-language parity harness (see fixtures/REGISTRY.md), which
#     asserts the SAME fixture files the Python reference generated;
#   - the neutrality scanner's self-test.
name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels that pull request's older run; runs on
# main are never cancelled.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
      # The parity module has no dependencies (no go.sum), so a module cache
      # could never hit.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version-file: parity/go/go.mod
          cache: false
      - name: scripts/check.sh (Python tests, Go parity, scanner self-test)
        run: scripts/check.sh
