# SPDX-License-Identifier: Apache-2.0
# Test workflow. Runs on `pull_request` (NOT pull_request_target) so it
# correctly receives NO secrets while executing PR code — the neutrality gate
# lives in a separate workflow for exactly this reason.
#
# Two jobs:
#   - python : the reference implementation and its tests, including the
#              distinct-id / same-semantic-digest test and the round-trip test.
#   - go     : the second-language parity harness (see fixtures/REGISTRY.md).
#              Asserts the SAME fixture files the Python reference generated.
name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e '.[dev]'
      - name: Test
        run: pytest -q

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Parity test (Go asserts the Python-generated fixtures)
        working-directory: parity/go
        run: go test ./...
