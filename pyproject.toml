# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capsule-emit-buzz"
version = "0.0.1"
description = "Buzz-side event -> EvidenceRecord adapter and parity fixtures. Consumes capsule-emit's public ConnectorPort."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Action State Group" }]
keywords = ["buzz", "nostr", "evidence-record", "capsule", "connector", "adapter"]

# capsule-emit: its public ConnectorPort, which this adapter implements, plus
# capsule_emit.produce (builds and signs the record) and capsule_emit.artifact
# (the record store type). produce is not in a release yet (PyPI 0.13.0
# predates it), so this pins the merged capsule-emit main revision until the
# next release.
dependencies = [
    "capsule-emit @ git+https://github.com/action-state-group/capsule-emit@e233c51438d84b9b0e1ed734f5a0554ced0d0ff3#subdirectory=python",
    # BIP-340 Schnorr verification of each Nostr event's signature
    # (libsecp256k1). Pinned; licensed MIT OR Apache-2.0.
    "coincurve==21.0.0",
    # Ed25519 for the audit-export manifest (export_manifest.py). Pinned;
    # licensed Apache-2.0 OR BSD-3-Clause.
    "cryptography==50.0.1",
    # The MMR, checkpoints, inclusion and consistency proofs for the
    # manifest log (manifest_log.py), and cll.log, the entry log the
    # connector appends to (0.6). Also a dependency of capsule-emit; named
    # here because it is imported directly. Apache-2.0.
    "checkpointed-local-log>=0.6.0",
]

[project.scripts]
capsule-emit-buzz-export = "capsule_emit_buzz.export_manifest:main"
capsule-emit-buzz-log = "capsule_emit_buzz.manifest_log:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/action-state-group/capsule-emit-buzz"

[tool.setuptools]
packages = ["capsule_emit_buzz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
